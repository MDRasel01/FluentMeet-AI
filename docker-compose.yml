version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: fluentmeet-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fluentmeet}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fluentmeet123}
      POSTGRES_DB: ${POSTGRES_DB:-fluentmeet_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fluentmeet} -d ${POSTGRES_DB:-fluentmeet_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: fluentmeet-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./services/api
      dockerfile: Dockerfile
    container_name: fluentmeet-api
    restart: unless-stopped
    environment:
      APP_ENV: development
      API_HOST: 0.0.0.0
      API_PORT: 8000
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-fluentmeet}:${POSTGRES_PASSWORD:-fluentmeet123}@postgres:5432/${POSTGRES_DB:-fluentmeet_db}
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-fluentmeet-super-secret-key-change-in-production-min-64-characters-0123456789}
    ports:
      - "8000:8000"
    volumes:
      - ./services/api:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: ./services/worker
      dockerfile: Dockerfile
    container_name: fluentmeet-worker
    restart: unless-stopped
    environment:
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./services/worker:/app
    depends_on:
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:

