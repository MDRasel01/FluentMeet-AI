name: Chrome Extension Automated Build & Release Pipeline

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      channel:
        description: 'Release channel (stable, beta, internal)'
        required: true
        default: 'stable'
        type: choice
        options:
          - stable
          - beta
          - internal
      notes:
        description: 'Release notes (optional summary)'
        required: false
        type: string

jobs:
  validate-and-build:
    name: Build, Scan & Package Extension
    runs-on: ubuntu-latest
    permissions:
      contents: write
      releases: write

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm Package Manager
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install Monorepo Dependencies
        run: pnpm install --frozen-lockfile=false

      - name: Run Extension Unit Tests
        working-directory: apps/extension
        run: pnpm test

      - name: Run Extension TypeScript Checks
        working-directory: apps/extension
        run: pnpm run lint

      - name: Build Production Extension Bundle
        working-directory: apps/extension
        run: pnpm build

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Backend Packaging Prerequisites
        working-directory: services/api
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" pydantic pydantic-settings

      - name: Package Extension & Enforce Secret Scanning
        id: package
        run: |
          CHANNEL="${{ github.event.inputs.channel || 'stable' }}"
          python scripts/package_extension.py --channel "$CHANNEL" --out-dir dist-releases

      - name: Verify Root Manifest V3 in Generated ZIP
        run: |
          python -c "
          import zipfile, glob, sys, json
          zips = glob.glob('dist-releases/**/*.zip', recursive=True)
          if not zips:
              sys.exit('No release zip found!')
          zf = zipfile.ZipFile(zips[0])
          names = zf.namelist()
          assert 'manifest.json' in names, 'manifest.json MUST be at the root of the ZIP'
          data = json.loads(zf.read('manifest.json'))
          assert data.get('manifest_version') == 3, 'Must be Manifest V3'
          print('Verified ZIP root contents:', [n for n in names if '/' not in n])
          "

      - name: Upload Release Artifacts to Workflow
        uses: actions/upload-artifact@v4
        with:
          name: extension-release-artifacts
          path: dist-releases/
          retention-days: 90

      - name: Publish GitHub Release (For Tagged Releases)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist-releases/**/*.zip
            dist-releases/**/checksum.sha256
            dist-releases/**/release-manifest.json
          draft: false
          prerelease: ${{ contains(github.ref, 'beta') || contains(github.ref, 'rc') }}
          generate_release_notes: true

